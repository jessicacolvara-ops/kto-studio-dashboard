<script>
// ─── CONFIG ───────────────────────────────────────────────
const URG_ORDER = ['Highest','High','Medium','Low','Lowest'];
const URG_CLS   = {Highest:'b-H',High:'b-Hi',Medium:'b-M',Low:'b-L',Lowest:'b-Lo'};
const URG_UG    = {Highest:'ug-H',High:'ug-Hi',Medium:'ug-M',Low:'ug-L',Lowest:'ug-Lo'};
const DONE_SET  = new Set(['concluído','concluido','entregue','done','closed','resolved','finalizado']);
const PALETTE   = ['#DA0000','#1e88e5','#43a047','#fb8c00','#8e24aa','#00838f','#e53935','#546e7a','#f4511e','#039be5'];
const PT_MON    = {jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
const STALE_DAYS = 60; // exclude open tasks with deadline > N days ago

// Studio members canonical names (for person cards)
const STUDIO_SET = new Set(['Matheus','Gabi','Vini','Rafael','Alessio','Tina','Pedro','Bucho']);

// ─── STATE ────────────────────────────────────────────────
let ALL=[], SHEETS_SECTIONS=[], CHARTS={}, activeTab='diario', selectedWeek=null, selectedMonth=null, selectedDay=null;
let SEED_TRELLO_DATA=[], SEED_JIRA_DATA=[];
let TASK_SETS={};
const FILT={camp:'',area:'',resp:'',solic:'',urg:'',tipo:'',status:'',origs:new Set()};

// ─── DATE UTILS ───────────────────────────────────────────
function parseDate(s){
  if(!s||!s.trim())return null;
  s=s.trim();
  // Jira: "09/set/26 12:00 AM"
  let m=s.match(/^(\d{1,2})\/([a-záéíóúã]{3})\/(\d{2,4})/i);
  if(m){const mon=PT_MON[m[2].toLowerCase()];if(mon!==undefined){const yr=+m[3]<100?2000+ +m[3]:+m[3];return new Date(yr,mon,+m[1]);}}
  // DD/MM/YYYY (Trello)
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){const a=+m[1],b=+m[2],yr=+m[3];if(a>12)return new Date(yr,b-1,a);if(b>12)return new Date(yr,a-1,b);return new Date(yr,b-1,a);}
  // M/D/YYYY or M/D/YY (Sheets)
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){const yr=+m[3]<100?2000+ +m[3]:+m[3];const a=+m[1],b=+m[2];if(a>12)return new Date(yr,b-1,a);if(b>12)return new Date(yr,a-1,b);return new Date(yr,a-1,b);}
  return null;
}
function parseDateSh(s){if(!s||!s.trim())return null;s=s.trim();const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){const yr=+m[3]<100?2000+ +m[3]:+m[3];return new Date(yr,+m[1]-1,+m[2]);}return null;}
function dateFmt(d){if(!d)return'—';return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function today(){const t=new Date();t.setHours(0,0,0,0);return t;}
function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function inDays(d,n){if(!d)return false;const t=today(),lim=new Date(t);lim.setDate(t.getDate()+n);return d>=t&&d<lim;}
function getWeek(){const t=today(),dow=t.getDay(),s=new Date(t);s.setDate(t.getDate()-(dow===0?6:dow-1));const e=new Date(s);e.setDate(s.getDate()+6);e.setHours(23,59,59,999);return{s,e};}
function inWeek(d){if(!d)return false;const w=getWeek();return d>=w.s&&d<=w.e;}
function monthKey(d){if(!d)return'';return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function monthLabel(k){if(!k)return'';const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('pt-BR',{month:'short',year:'numeric'});}
function weekKey(d){const t=new Date(d);t.setHours(0,0,0,0);const dow=t.getDay(),mon=new Date(t);mon.setDate(t.getDate()-(dow===0?6:dow-1));return`${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;}
function weekFromKey(k){const[y,mo,d]=k.split('-').map(Number);const s=new Date(y,mo-1,d);s.setHours(0,0,0,0);const e=new Date(s);e.setDate(s.getDate()+6);e.setHours(23,59,59,999);return{s,e};}
function weekLabel(k){const{s,e}=weekFromKey(k);const f=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});return`${f(s)} – ${f(e)}`;}
function daysAgo(n){const t=today();t.setDate(t.getDate()-n);return t;}

// ─── BUSINESS LOGIC ───────────────────────────────────────
const isDone  = r=>DONE_SET.has((r.status||'').toLowerCase().trim());
const isOpen  = r=>!isDone(r)&&(r.status||'').toLowerCase()!=='parking lot';
const deadline= r=>r.prazoNegociado||r.prazoSolicitado;
const isLate  = r=>{if(isDone(r))return false;const d=deadline(r);return d&&d<today();};
const isSoon  = r=>{const d=deadline(r);if(!d||isDone(r))return false;return inDays(d,3)&&d>=today();};
const dlToday = r=>sameDay(deadline(r),today());
const dlThisWeek = r=>inWeek(deadline(r));
const delivToday = r=>isDone(r)&&sameDay(r.dataEntrega,today());
const delivThisWeek = r=>isDone(r)&&inWeek(r.dataEntrega);
function dlInWeek(r,ws,we){const d=deadline(r);return d&&d>=ws&&d<=we;}
function delivInWeek(r,ws,we){return isDone(r)&&r.dataEntrega&&r.dataEntrega>=ws&&r.dataEntrega<=we;}
function dlMonthKey(r,mk){const d=deadline(r);if(!d)return false;return monthKey(d)===mk;}
function delivMonthKey(r,mk){return isDone(r)&&r.dataEntrega&&monthKey(r.dataEntrega)===mk;}

// Staleness filter: exclude OPEN tasks whose deadline was > STALE_DAYS ago
function isStale(r){
  if(isDone(r))return false; // keep all done tasks
  const d=deadline(r);
  if(!d)return false; // no deadline → can't determine, keep it
  return d<daysAgo(STALE_DAYS);
}

// ─── NAME / PERSON UTILS ──────────────────────────────────
function studioName(raw){
  if(!raw)return null;
  const rl=raw.trim().toLowerCase();
  if(rl.includes('alessio'))                                          return'Alessio';
  if(rl.includes('vini')||rl.includes('wini')||rl.includes('vinicius')) return'Vini';
  if(rl.includes('gabriel')||rl.startsWith('gabi')||rl.startsWith('gabe')) return'Gabi';
  if(rl.includes('matheus')||rl.includes('mathew'))                   return'Matheus';
  // Rafael AFTER alessio check (Rafael de Alessio handled above)
  if(rl.includes('rafael'))                                           return'Rafael';
  if(rl.includes('tina'))                                             return'Tina';
  if(rl.includes('bucho'))                                            return'Bucho';
  // Pedro — only if not Macedo
  if(rl.startsWith('pedro')&&!rl.includes('macedo'))                  return'Pedro';
  return null; // not a known studio member
}

function personEntries(r){
  const raw=(r.responsavel||'').split(/[,\/]/).map(s=>s.trim()).filter(Boolean);
  if(!raw.length)return[];
  return raw.map(s=>({name:studioName(s)||s.split(' ')[0],isStudio:!!studioName(s),raw:s,pecas:Math.ceil((r.pecas||1)/raw.length),tasks:1}));
}
function getPersonStats(rows){
  const m={};
  rows.forEach(r=>{
    personEntries(r).filter(p=>STUDIO_SET.has(p.name)||STUDIO_SET.has(studioName(p.raw))).forEach(p=>{
      const name=studioName(p.raw)||p.name;
      if(!STUDIO_SET.has(name))return;
      if(!m[name])m[name]={tasks:0,pecas:0,late:0,done:0,rows:[]};
      m[name].tasks++;m[name].pecas+=p.pecas;m[name].rows.push(r);
      if(isDone(r))m[name].done++;
      if(isLate(r))m[name].late++;
    });
  });
  return m;
}

// ─── TRELLO STUDIO FILTER ─────────────────────────────────
function trelloHasStudioMember(membros){
  if(!membros)return false;
  return membros.split(',').some(m=>studioName(m.trim())!==null);
}

// ─── DEDUPLICATION ────────────────────────────────────────
function normTitle(s){
  return(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
}
function deduplicateAll(rows){
  const seenUrl=new Map(),seenTitleCamp=new Map(),result=[];
  // Priority: Sheets first; Jira and Trello have equal weight (interleaved)
  const jiratrello=rows.filter(r=>r.origem==='Jira'||r.origem==='Trello');
  const ordered=[
    ...rows.filter(r=>r.origem==='Sheets'),
    ...jiratrello,
  ];
  for(const r of ordered){
    const url=r.url&&r.url!=='#'?r.url:null;
    const tk=normTitle(r.titulo)+'__'+(r.campanha||'').toLowerCase().trim();
    if(url&&seenUrl.has(url))continue;
    if(seenTitleCamp.has(tk))continue;
    if(url)seenUrl.set(url,true);
    seenTitleCamp.set(tk,true);
    result.push(r);
  }
  return result;
}

// ─── BADGES ───────────────────────────────────────────────
function urgBadge(u){return`<span class="bdg ${URG_CLS[u]||'b-M'}">${u||'—'}</span>`;}
function statusBadge(s){
  const sl=(s||'').toLowerCase();let cls='b-other';
  if(sl.includes('conclu')||sl.includes('entregue')||sl==='done')cls='b-ok';
  else if(sl.includes('andamento')||sl.includes('progresso')||sl.includes('edição')||sl.includes('copy em')||sl.includes('motion'))cls='b-prog';
  else if(sl.includes('aprovação')||sl.includes('validar'))cls='b-wait';
  else if(sl.includes('entrada')||sl.includes('briefing')||sl.includes('pendentes')||sl.includes('fazer')||sl.includes('planejado'))cls='b-entr';
  return`<span class="bdg ${cls}">${s||'—'}</span>`;
}
function origBadge(o){
  if(o==='Trello')return`<span class="bdg b-T">Trello</span>`;
  if(o==='Jira')return`<span class="bdg b-J">Jira</span>`;
  if(o==='Sheets')return`<span class="bdg b-S">Sheets</span>`;
  return`<span class="bdg b-other">${o}</span>`;
}

// ─── PARSERS ──────────────────────────────────────────────
// Lista names that mean the task is genuinely done in Trello
const TRELLO_DONE_KW=[
  'done','concluí','finaliz','agendado','postado','aprovado','cancelado',
  'backlog', // ALL backlog lists are considered done
  'icones','icons','série a','serie a'
];
function isTrelloDoneByLista(lista){
  const l=(lista||'').toLowerCase().trim();
  if(TRELLO_DONE_KW.some(kw=>l.includes(kw)))return true;
  // Old campaign-specific lists with date ranges like "(01/05 - 31/05)" or "(January - May)"
  if(/\(\d{2}\/\d{2}[\s–-]+\d{2}\/\d{2}\)/.test(l))return true;
  if(/\(january|february|march|april|may|june|july|august|september|october|november|december/i.test(lista||''))return true;
  return false;
}

function parseTrelloToUnified(rows){
  return rows
    .filter(r=>r.card&&trelloHasStudioMember(r.membros))
    .map(r=>{
      // Use Lista (actual board position) to determine done, NOT the Status custom field
      // Status custom field is often out of sync; Lista is the ground truth
      const done=isTrelloDoneByLista(r.lista);
      const prazo=parseDate(r.prazo);
      const m=r.url.match(/\/(\d+)-/);
      const id=m?`T-${m[1]}`:'T-?';
      return{id,titulo:r.card,tipo:r.funcoes.split(',')[0].trim()||'Design',area:r.board,
        campanha:r.board,pecas:1,prazoNegociado:prazo,prazoSolicitado:prazo,
        dataEntrega:done?prazo:null,urgencia:'Medium',
        status:r.lista||r.status||'',   // Show lista as status — much more informative
        responsavel:r.membros,quemSolicitou:'',origem:'Trello',url:r.url||'#',lista:r.lista};
    });
}
function parseJiraToUnified(rows){
  return rows.map(r=>{
    const done=DONE_SET.has((r.status||'').toLowerCase().trim());
    const prazo=parseDate(r.prazo);
    return{id:r.chave,titulo:r.resumo,tipo:r.tipo,area:r.projeto,campanha:r.projeto,
      pecas:1,prazoNegociado:prazo,prazoSolicitado:prazo,dataEntrega:done?prazo:null,
      urgencia:r.prioridade||'Medium',status:r.status,responsavel:r.responsavel,
      quemSolicitou:'',origem:'Jira',url:r.url||'#',lista:''};
  }).filter(r=>r.titulo);
}
function parseSheetsToUnified(sections){
  const rows=[],seen=new Map();
  const ordered=[...sections].reverse();
  ordered.forEach((sec)=>{
    sec.rows.forEach(r=>{
      const key=(r.linkTask&&r.linkTask.startsWith('http'))?r.linkTask:normTitle(r.request)+'__'+(r.campaign||'').toLowerCase();
      if(seen.has(key))return;
      seen.set(key,true);
      const done=DONE_SET.has((r.status||'').toLowerCase().trim());
      const prazo=parseDateSh(r.deadline);
      rows.push({id:`S-${sec.sectionIndex}-${r.id}`,titulo:r.request,tipo:r.origin,
        area:r.origin,campanha:r.campaign,pecas:parseInt(r.assets)||1,
        prazoNegociado:prazo,prazoSolicitado:prazo,dataEntrega:done?prazo:null,
        urgencia:'Medium',status:r.status,
        responsavel:r.studio||'',       // ONLY studio person, not owner
        quemSolicitou:r.owner||'',      // owner = requester
        origem:'Sheets',url:(r.linkTask&&r.linkTask.startsWith('http'))?r.linkTask:'#',
        lista:'',_day:sec.dayLabel,_secIdx:sec.sectionIndex});
    });
  });
  return rows;
}

// ─── SHEETS MARKDOWN PARSER ───────────────────────────────
function parseSheetsMarkdown(raw){
  const lines=raw.split('\n'),sections=[];
  let cur=null,colMap={};
  for(const line of lines){
    if(!line.startsWith('|'))continue;
    const cells=line.split('|').slice(1,-1).map(c=>c.trim());
    if(cells.length<2)continue;
    if(cells.every(c=>c===''||/^:?-+:?$/.test(c)))continue;
    if(cells[1]==='ID'){
      colMap={};
      cells.slice(1).forEach((h,i)=>{
        const hl=h.toLowerCase().trim();
        if(hl==='id')colMap.id=i;else if(hl==='origin')colMap.origin=i;
        else if(hl==='request')colMap.request=i;else if(hl==='campaign')colMap.campaign=i;
        else if(hl==='assets')colMap.assets=i;else if(hl.startsWith('link task'))colMap.linkTask=i;
        else if(hl==='deadline')colMap.deadline=i;else if(hl==='owner')colMap.owner=i;
        else if(hl==='status')colMap.status=i;else if(hl==='studio')colMap.studio=i;
        else if(hl.startsWith('link dropbox'))colMap.linkDropbox=i;
      });
      cur={dayLabel:cells[0],sectionIndex:sections.length,rows:[]};sections.push(cur);continue;
    }
    if(!cur)continue;
    const d=cells.slice(1);
    if(!d[colMap.id]||!/^CE-\d+$/.test(d[colMap.id]))continue;
    cur.rows.push({id:d[colMap.id]||'',origin:d[colMap.origin]||'',request:d[colMap.request]||'',
      campaign:d[colMap.campaign]||'',assets:d[colMap.assets]||'',linkTask:d[colMap.linkTask]||'',
      deadline:d[colMap.deadline]||'',owner:d[colMap.owner]||'',status:d[colMap.status]||'',
      studio:colMap.studio!==undefined?(d[colMap.studio]||''):'',
      linkDropbox:colMap.linkDropbox!==undefined?(d[colMap.linkDropbox]||''):'',});
  }
  return sections;
}

// ─── SORT BY DEADLINE ─────────────────────────────────────
function sortByDeadline(rows){
  return[...rows].sort((a,b)=>{
    const da=deadline(a),db=deadline(b);
    if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;
    return da-db;
  });
}

// ─── FILTERS ──────────────────────────────────────────────
function applyFilters(rows){
  return rows.filter(r=>{
    if(FILT.camp&&r.campanha!==FILT.camp)return false;
    if(FILT.area&&r.area!==FILT.area)return false;
    if(FILT.resp){const names=personEntries(r).map(p=>studioName(p.raw)||p.name);if(!names.includes(FILT.resp))return false;}
    if(FILT.solic&&r.quemSolicitou!==FILT.solic)return false;
    if(FILT.urg&&r.urgencia!==FILT.urg)return false;
    if(FILT.tipo&&r.tipo!==FILT.tipo)return false;
    if(FILT.status&&normStatus(r.status)!==FILT.status)return false;
    if(FILT.origs.size>0&&!FILT.origs.has(r.origem))return false;
    return true;
  });
}
function normStatus(s){
  const sl=(s||'').toLowerCase().trim();
  if(sl.includes('conclu')||sl==='entregue')return'Concluído';
  if(sl.includes('andamento'))return'Em andamento';
  if(sl.includes('pendente')||sl.includes('fazer')||sl.includes('planejado'))return'Pendente/A fazer';
  if(sl.includes('aprovação')||sl.includes('validar'))return'Em aprovação';
  return s;
}

function countBy(rows,fn){const m={};rows.forEach(r=>{const k=fn(r);m[k]=(m[k]||0)+1;});return m;}
function sumBy(rows,kfn,vfn){const m={};rows.forEach(r=>{const k=kfn(r);m[k]=(m[k]||0)+(vfn(r)||0);});return m;}
function topN(obj,n=10){return Object.entries(obj).filter(([k])=>k&&k!=='undefined'&&k!=='').sort((a,b)=>b[1]-a[1]).slice(0,n);}

// ─── UPLOAD HANDLERS ──────────────────────────────────────
function dzOver(e,id){e.preventDefault();document.getElementById(id).classList.add('drag');}
function dzLeave(e,id){document.getElementById(id).classList.remove('drag');}
function dzDrop(e,type){e.preventDefault();document.getElementById(type==='trello'?'tz':'jz').classList.remove('drag');const f=e.dataTransfer.files[0];if(f)readFile(f,type);}
function fileIn(e,type){const f=e.target.files[0];if(f)readFile(f,type);}


function parseCSVRaw(text){
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=c;}
    else{if(c==='"')inQ=true;else if(c===','){row.push(field);field='';}else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}else if(c!=='\r')field+=c;}}
  if(field||row.length){row.push(field);rows.push(row);}return rows;
}
function parseTrelloRaw(text){
  const rows=parseCSVRaw(text);if(rows.length<2)return[];
  const h={};rows[0].forEach((v,i)=>h[v.trim()]=i);
  return rows.slice(1).filter(r=>r[h['Card']]).map(r=>({
    status:(r[h['Status']]||'').trim(),motivo:(r[h['Motivo']]||'').trim(),card:(r[h['Card']]||'').trim(),
    membros:(r[h['Membros']]||'').trim(),funcoes:(r[h['Funções']]||'').trim(),
    board:(r[h['Board']]||'').trim(),lista:(r[h['Lista']]||'').trim(),
    prazo:(r[h['Prazo']]||'').trim(),url:(r[h['URL']]||'').trim(),})).filter(r=>r.card);
}
function parseJiraRaw(text){
  const rows=parseCSVRaw(text);if(rows.length<2)return[];
  const h={};rows[0].forEach((v,i)=>{const t=v.trim();if(['Resumo','Chave da item','Tipo de item','Status','Nome do projeto','Responsável','Data limite','Prioridade'].includes(t))h[t]=i;});
  const g=(r,k)=>h[k]!==undefined?(r[h[k]]||'').trim():'';
  const pmap={'Highest':'Highest','Urgent':'Highest','Critical':'Highest','High':'High','Alta':'High','Medium':'Medium','Média':'Medium','Low':'Low','Baixa':'Low','Lowest':'Lowest'};
  return rows.slice(1).filter(r=>g(r,'Resumo')).map(r=>{
    const chave=g(r,'Chave da item');
    return{resumo:g(r,'Resumo'),chave,tipo:g(r,'Tipo de item'),status:g(r,'Status'),
      projeto:g(r,'Nome do projeto'),responsavel:g(r,'Responsável'),prazo:g(r,'Data limite'),
      prioridade:pmap[g(r,'Prioridade')]||'Medium',url:chave?`https://mobiltoperations.atlassian.net/browse/${chave}`:'',};
  }).filter(r=>r.resumo);
}

function normTitle(s){return(s||'').toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();}
function diffImport(oldRaw,newRaw,parseToUnified){
  const oldU=parseToUnified(oldRaw);
  const newU=parseToUnified(newRaw);
  const oldMap={};oldU.forEach(r=>{oldMap[normTitle(r.titulo)]=r;});
  const newMap={};newU.forEach(r=>{newMap[normTitle(r.titulo)]=r;});
  const nowDone=[],nowOpen=[],added=[],removed=[];
  for(const k of Object.keys(newMap)){
    const n=newMap[k];
    if(oldMap[k]){
      if(isOpen(oldMap[k])&&isDone(n))nowDone.push(n);
      else if(isDone(oldMap[k])&&isOpen(n))nowOpen.push(n);
    }else{
      added.push(n);
    }
  }
  for(const k of Object.keys(oldMap)){if(!newMap[k])removed.push(oldMap[k]);}
  return{nowDone,nowOpen,added,removed};
}
function showDiffModal(diff,source){
  const total=diff.nowDone.length+diff.nowOpen.length+diff.added.length+diff.removed.length;
  if(!total)return;
  const rows=(arr,color,icon)=>arr.length?`<div style="margin-bottom:14px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:${color};margin-bottom:6px;letter-spacing:.5px">${icon} ${arr.length} task${arr.length!==1?'s':''}</div>${arr.map(r=>`<div style="padding:4px 0;border-bottom:1px solid #f5f5f5;font-size:11px;display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600">${r.titulo}</span><span style="color:#999;font-size:10px;white-space:nowrap">${r.campanha||''}</span></div>`).join('')}</div>`:'';
  const html=`
  <div style="padding:4px 0 12px;font-size:11px;color:#888">Comparação com o import anterior — <strong style="color:#111">${source}</strong></div>
  ${rows(diff.nowDone,'#007a3a','✅ Concluídas desde o último import')}
  ${rows(diff.added,'#1565c0','🆕 Tasks novas')}
  ${rows(diff.nowOpen,'#E65100','🔄 Reabertas')}
  ${rows(diff.removed,'#DA0000','🗑 Removidas do CSV')}`;
  document.getElementById('modal-title').textContent='O que mudou?';
  document.getElementById('modal-sub').textContent='';
  document.getElementById('modal-count').textContent=`${total} alteração${total!==1?'s':''}`;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}

function readFile(file,type){
  const reader=new FileReader();
  reader.onload=e=>{
    let text=e.target.result.replace(/^﻿/,'');
    if(type==='trello'){
      const oldRaw=SEED_TRELLO_DATA.length?SEED_TRELLO_DATA:null;
      const newRaw=parseTrelloRaw(text);
      if(oldRaw&&newRaw.length){
        const diff=diffImport(oldRaw,newRaw,parseTrelloToUnified);
        SEED_TRELLO_DATA=newRaw;
        try{localStorage.setItem('kto_trello',JSON.stringify(SEED_TRELLO_DATA));}catch(_){}
        rebuildALL();renderDados();renderCurrent();
        showDiffModal(diff,'Trello');
      }else{
        SEED_TRELLO_DATA=newRaw;
        try{localStorage.setItem('kto_trello',JSON.stringify(SEED_TRELLO_DATA));}catch(_){}
        rebuildALL();renderDados();renderCurrent();
      }
    }else{
      const oldRaw=SEED_JIRA_DATA.length?SEED_JIRA_DATA:null;
      const newRaw=parseJiraRaw(text);
      if(oldRaw&&newRaw.length){
        const diff=diffImport(oldRaw,newRaw,parseJiraToUnified);
        SEED_JIRA_DATA=newRaw;
        try{localStorage.setItem('kto_jira',JSON.stringify(SEED_JIRA_DATA));}catch(_){}
        rebuildALL();renderDados();renderCurrent();
        showDiffModal(diff,'Jira');
      }else{
        SEED_JIRA_DATA=newRaw;
        try{localStorage.setItem('kto_jira',JSON.stringify(SEED_JIRA_DATA));}catch(_){}
        rebuildALL();renderDados();renderCurrent();
      }
    }
  };
  reader.readAsText(file,'UTF-8');
}

// ─── REBUILD ALL ──────────────────────────────────────────
let LAST_DEDUP_COUNT=0;
function rebuildALL(){
  const trelloRows=parseTrelloToUnified(SEED_TRELLO_DATA);
  const jiraRows=parseJiraToUnified(SEED_JIRA_DATA);
  const sheetsRows=parseSheetsToUnified(SHEETS_SECTIONS);
  const merged=[...trelloRows,...jiraRows,...sheetsRows];
 const deduped=deduplicateAll(merged);
  LAST_DEDUP_COUNT=merged.length-deduped.length;
  ALL=deduped;
  populateFilters(ALL);
}

// ─── RENDER CURRENT ───────────────────────────────────────
function renderCurrent(){
  TASK_SETS={};
  const rows=applyFilters(ALL);
  if(activeTab==='geral')renderGeral(rows);
  else if(activeTab==='diario')renderDiario(rows);
  else if(activeTab==='semanal')renderSemanal(rows);
  else if(activeTab==='mensal')renderMensal(rows);
  else if(activeTab==='sla')renderSLA(rows);
  else if(activeTab==='gargalos')renderGargalos(rows);
  else if(activeTab==='daily')renderDaily();
  else if(activeTab==='dados')renderDados();
}

// ─── LOAD SHEETS (MCP — Google Drive) ─────────────────────
const SHEETS_ID='1To7O4BklFklSaXHZbM_UiLGH3wMw2kKJaQHmb4aLNb8';
const SHEETS_BASE=`https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:csv&sheet=`;

function parseSheetsCSVSection(csvText,sheetName,sectionIndex){
  const rows=parseCSVRaw(csvText);
  if(rows.length<2)return null;
  const hdrRow=rows[0];
  const dayLabel=(hdrRow[0]||sheetName).replace(/^"|"$/g,'');
  const colMap={};
  hdrRow.slice(1).forEach((h,i)=>{
    const hl=(h||'').toLowerCase().trim();
    if(hl==='id')colMap.id=i;
    else if(hl==='origin')colMap.origin=i;
    else if(hl==='request')colMap.request=i;
    else if(hl==='campaign')colMap.campaign=i;
    else if(hl==='assets')colMap.assets=i;
    else if(hl.startsWith('link task'))colMap.linkTask=i;
    else if(hl==='deadline')colMap.deadline=i;
    else if(hl==='owner')colMap.owner=i;
    else if(hl==='status')colMap.status=i;
    else if(hl==='studio')colMap.studio=i;
    else if(hl.startsWith('link dropbox'))colMap.linkDropbox=i;
  });
  const get=(d,k)=>colMap[k]!==undefined?(d[colMap[k]]||'').trim():'';
  const dataRows=rows.slice(1)
    .filter(r=>{const id=(r[1]||'').trim();return/^CE-\d+$/.test(id);})
    .map(r=>{
      const d=r.slice(1);
      return{id:get(d,'id'),origin:get(d,'origin'),request:get(d,'request'),
        campaign:get(d,'campaign'),assets:get(d,'assets'),linkTask:get(d,'linkTask'),
        deadline:get(d,'deadline'),owner:get(d,'owner'),status:get(d,'status'),
        studio:get(d,'studio'),linkDropbox:get(d,'linkDropbox')};
    });
  if(!dataRows.length)return null;
  return{dayLabel,sectionIndex,rows:dataRows};
}

async function loadSheets(){
  const btn=document.getElementById('btn-refresh-sheets');
  if(btn){btn.textContent='⏳ Atualizando…';btn.disabled=true;}
  try{
    const result=await window.cowork.callMcpTool(
      'mcp__9f84d5aa-c0d2-4ac8-a5c3-7f50b81e8e73__read_file_content',
      {fileId:'1To7O4BklFklSaXHZbM_UiLGH3wMw2kKJaQHmb4aLNb8'}
    );
    let data;
    try{data=result.structuredContent??JSON.parse(result.content[0].text);}
    catch(e){data={fileContent:result.content?.[0]?.text||''};}
    const raw=typeof data==='string'?data:(data.fileContent||'');
    SHEETS_SECTIONS=parseSheetsMarkdown(raw);
    const t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('upd-time').textContent=`Atualizado ${t}`;
    if(btn){btn.textContent='✅ Atualizado';setTimeout(()=>{btn.textContent='🔄 Atualizar';btn.disabled=false;},2000);}
  }catch(err){
    document.getElementById('upd-time').textContent='Sheets: erro ao carregar';
    if(btn){btn.textContent='❌ Erro';btn.disabled=false;}
    console.warn('Sheets load error:',err);
  }
}

async function refreshSheets(){
  await loadSheets();
  rebuildALL();
  renderCurrent();
}

}));
['f-camp','f-area','f-resp','f-solic','f-urg','f-tipo','f-status'].forEach(id=>{

});
document.querySelectorAll('.obtn').forEach(b=>b.addEventListener('click',()=>{
  const o=b.dataset.orig,cls=o==='Trello'?'on-T':o==='Jira'?'on-J':'on-S';
  if(FILT.origs.has(o)){FILT.origs.delete(o);b.classList.remove(cls);}
  else{FILT.origs.add(o);b.classList.add(cls);}
  renderCurrent();
}));
document.getElementById('btn-reset').addEventListener('click',()=>{
  FILT.camp=FILT.area=FILT.resp=FILT.solic=FILT.urg=FILT.tipo=FILT.status='';FILT.origs.clear();
  ['f-camp','f-area','f-resp','f-solic','f-urg','f-tipo','f-status'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('.obtn').forEach(b=>b.className='obtn');
  renderCurrent();
});
